name: Build MasterLens (macOS + Windows)

on:
  push:
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: masterlens-${{ github.ref }}
  cancel-in-progress: true

env:
  JUCE_TAG: "8.0.15"
  APP_VERSION: "3.0.1"

jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7

      - name: Fetch JUCE ${{ env.JUCE_TAG }}
        run: git clone --depth 1 --branch "${JUCE_TAG}" https://github.com/juce-framework/JUCE.git .tools/JUCE

      - name: Prepare codec runtime
        env:
          FFMPEG_MACOS_UNIVERSAL_URL: ${{ vars.FFMPEG_MACOS_UNIVERSAL_URL }}
          FFMPEG_MACOS_UNIVERSAL_SHA256: ${{ vars.FFMPEG_MACOS_UNIVERSAL_SHA256 }}
        run: scripts/ci-prepare-ffmpeg.sh macos-universal third_party/ffmpeg/macos-universal

      - name: Configure
        run: >
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          -G "Unix Makefiles" -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"

      - name: Build (all bundles)
        run: cmake --build build --config Release --target MasterLens_AU MasterLens_VST3 MasterLens_Standalone MasterLensCli MasterLensDspTest MasterLensUiShot -j 4

      - name: DSP regression
        run: ./build/MasterLensDspTest_artefacts/Release/MasterLensDspTest

      - name: Editor layout regression
        run: python3 scripts/check_ui.py --build-dir build

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: MasterLens-layout-report
          path: docs/layout-*.json
          if-no-files-found: warn

      - name: FFmpeg test dependency
        run: |
          if [ -z "${MASTERLENS_FFMPEG:-}" ]; then
            command -v ffmpeg || brew install ffmpeg
          fi

      - name: File QC integration
        run: python3 Tests/test_cli.py build/MasterLensCli_artefacts/Release/MasterLensCli

      - name: Independent measurement regression
        run: python3 Tests/validate_measurements.py build/MasterLensDspTest_artefacts/Release/MasterLensDspTest --output measurement-generated.json

      - name: Package DMG
        run: |
          set -e
          mkdir -p stage
          cp -R build/MasterLens_artefacts/Release/VST3/MasterLens.vst3 stage/
          cp -R build/MasterLens_artefacts/Release/AU/MasterLens.component stage/
          cp -R build/MasterLens_artefacts/Release/Standalone/MasterLens.app stage/
          if [ -x build/MasterLensCli_artefacts/Release/MasterLensCli ]; then
            cp build/MasterLensCli_artefacts/Release/MasterLensCli stage/
          fi
          cp packaging/Install.command "stage/安装 Install.command"
          cp packaging/Uninstall.command "stage/卸载 Uninstall.command"
          cp packaging/README-DMG.txt "stage/使用说明 README.txt"
          mkdir -p stage/Licenses
          cp Resources/fonts/OFL.txt stage/Licenses/Geist-OFL.txt

          # Bundled codec runtime: nested binary first, then the bundles (guide §三.7).
          if [ -n "${MASTERLENS_FFMPEG:-}" ] && [ -f "$MASTERLENS_FFMPEG" ]; then
            scripts/verify-runtime.sh "$MASTERLENS_FFMPEG" macos-universal
            for bundle in stage/MasterLens.vst3 stage/MasterLens.component stage/MasterLens.app; do
              mkdir -p "$bundle/Contents/Resources"
              cp "$MASTERLENS_FFMPEG" "$bundle/Contents/Resources/ffmpeg"
              chmod +x "$bundle/Contents/Resources/ffmpeg"
              codesign --force -s - "$bundle/Contents/Resources/ffmpeg" || true
            done
            cp "$MASTERLENS_FFMPEG" stage/ffmpeg
            chmod +x stage/ffmpeg
            cp third_party/ffmpeg/macos-universal/FFmpeg-* stage/Licenses/ 2>/dev/null || true
            cp packaging/THIRD-PARTY-NOTICES.md stage/Licenses/
            printf '{"present":true,"version":"%s"}\n' "$("$MASTERLENS_FFMPEG" -hide_banner -version | head -1)" > runtime-macos.json
          elif [ "${ALLOW_MISSING_RUNTIME:-0}" = "1" ]; then
            echo "::warning::Packaging without the FFmpeg runtime (prerelease validation build)."
            printf '{"present":false}\n' > runtime-macos.json
          else
            echo "::error::FFmpeg runtime required for this package."
            exit 1
          fi

          chmod +x "stage/安装 Install.command" "stage/卸载 Uninstall.command"
          codesign --force --deep -s - stage/MasterLens.vst3 || true
          codesign --force --deep -s - stage/MasterLens.component || true
          hdiutil create -volname "MasterLens ${APP_VERSION}" -srcfolder stage -fs HFS+ \
                  -format UDZO -ov "MasterLens-${APP_VERSION}-macOS.dmg"
          SIZE=$(stat -f%z "MasterLens-${APP_VERSION}-macOS.dmg")
          echo "DMG size: $SIZE bytes"
          test "$SIZE" -gt 1000000

      - uses: actions/upload-artifact@v7
        with:
          name: MasterLens-macOS
          path: |
            MasterLens-${{ env.APP_VERSION }}-macOS.dmg
            runtime-macos.json
          if-no-files-found: error
          retention-days: 30

  windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
          - arch: ARM64
    steps:
      - uses: actions/checkout@v7

      - name: Fetch JUCE ${{ env.JUCE_TAG }}
        shell: bash
        run: git clone --depth 1 --branch "${JUCE_TAG}" https://github.com/juce-framework/JUCE.git .tools/JUCE

      - name: Prepare codec runtime
        shell: bash
        env:
          FFMPEG_WINDOWS_X64_URL: ${{ vars.FFMPEG_WINDOWS_X64_URL }}
          FFMPEG_WINDOWS_X64_SHA256: ${{ vars.FFMPEG_WINDOWS_X64_SHA256 }}
          FFMPEG_WINDOWS_ARM64_URL: ${{ vars.FFMPEG_WINDOWS_ARM64_URL }}
          FFMPEG_WINDOWS_ARM64_SHA256: ${{ vars.FFMPEG_WINDOWS_ARM64_SHA256 }}
          ARCH: ${{ matrix.arch }}
        run: |
          if [ "$ARCH" = "x64" ]; then P=windows-x64; else P=windows-arm64; fi
          scripts/ci-prepare-ffmpeg.sh "$P" "third_party/ffmpeg/$P"

      - name: Detect Visual Studio generator
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $ver = & $vswhere -latest -products * -property installationVersion
          $path = & $vswhere -latest -products * -property installationPath
          Write-Host "Visual Studio $ver at $path"
          $major = [int](($ver -split '\.')[0])
          $gen = switch ($major) {
            17 { "Visual Studio 17 2022" }
            18 { "Visual Studio 18 2026" }
            default { "Visual Studio 18 2026" }
          }
          "VS_GENERATOR=$gen" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "Generator: $gen"
          Get-ChildItem "$path\VC\Tools\MSVC" -Directory | Select-Object -ExpandProperty Name

      - name: Configure (MSVC ${{ matrix.arch }})
        run: cmake -S . -B build -G "$env:VS_GENERATOR" -A ${{ matrix.arch }}

      - name: Build VST3 + Standalone + CLI
        run: |
          cmake --build build --config Release --target MasterLens_VST3 -j 4
          cmake --build build --config Release --target MasterLens_Standalone -j 4
          cmake --build build --config Release --target MasterLensCli -j 4

      - name: DSP regression (native x64)
        if: matrix.arch == 'x64'
        run: |
          cmake --build build --config Release --target MasterLensDspTest -j 4
          ./build/MasterLensDspTest_artefacts/Release/MasterLensDspTest.exe

      - name: Install NSIS
        run: choco install nsis -y --no-progress

      - name: FFmpeg test dependency (native x64)
        if: matrix.arch == 'x64'
        run: |
          if [ -z "$MASTERLENS_FFMPEG" ]; then choco install ffmpeg -y --no-progress; fi
        shell: bash

      - name: File QC integration (native x64)
        if: matrix.arch == 'x64'
        run: python Tests/test_cli.py build/MasterLensCli_artefacts/Release/MasterLensCli.exe

      - name: Stage files
        shell: pwsh
        run: |
          $stage = Join-Path $PWD "stage-${{ matrix.arch }}"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item -Recurse "build/MasterLens_artefacts/Release/VST3/MasterLens.vst3" $stage
          Copy-Item "build/MasterLens_artefacts/Release/Standalone/MasterLens.exe" $stage
          Copy-Item "build/MasterLensCli_artefacts/Release/MasterLensCli.exe" $stage
          New-Item -ItemType Directory -Force -Path "$stage/Licenses" | Out-Null
          Copy-Item "Resources/fonts/OFL.txt" "$stage/Licenses/Geist-OFL.txt"

          $runtime = Join-Path $PWD "third_party/ffmpeg/windows-${{ matrix.arch }}/ffmpeg.exe"
          if (Test-Path $runtime) {
            New-Item -ItemType Directory -Force -Path "$stage/ffmpeg" | Out-Null
            Copy-Item $runtime "$stage/ffmpeg/ffmpeg.exe"
            $vstRes = Join-Path $stage "MasterLens.vst3/Contents/Resources/ffmpeg"
            New-Item -ItemType Directory -Force -Path $vstRes | Out-Null
            Copy-Item $runtime "$vstRes/ffmpeg.exe"
            Copy-Item "packaging/THIRD-PARTY-NOTICES.md" "$stage/Licenses/"
            Copy-Item "third_party/ffmpeg/windows-${{ matrix.arch }}/FFmpeg-*" "$stage/Licenses/" -ErrorAction SilentlyContinue
            '{"present":true}' | Out-File -Encoding ascii "runtime-windows-${{ matrix.arch }}.json"
            Write-Host "Bundled FFmpeg runtime staged"
          } elseif ($env:ALLOW_MISSING_RUNTIME -eq "1") {
            Write-Host "::warning::Packaging without the FFmpeg runtime (prerelease validation build)."
            '{"present":false}' | Out-File -Encoding ascii "runtime-windows-${{ matrix.arch }}.json"
          } else {
            throw "FFmpeg runtime required for this package"
          }

          "STAGE_DIR=$stage" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Build installer (NSIS)
        shell: pwsh
        run: |
          $out = Join-Path $PWD "MasterLens-${{ env.APP_VERSION }}-Windows-${{ matrix.arch }}.exe"
          $argsList = @(
            "-WX",
            "/V2",
            "/DVERSION=${{ env.APP_VERSION }}",
            "/DARCH=${{ matrix.arch }}",
            "/DSTAGE=$env:STAGE_DIR",
            "/DOUTFILE=$out",
            "packaging/installer.nsi"
          )
          if ($env:ALLOW_MISSING_RUNTIME -eq "1") { $argsList = @($argsList[0..4]) + "/DALLOW_MISSING_RUNTIME=1" + $argsList[5] }
          & "${env:ProgramFiles(x86)}\NSIS\makensis.exe" @argsList
          if (!(Test-Path $out)) { throw "NSIS 未生成安装包" }

      - name: Installer smoke test (native x64)
        if: matrix.arch == 'x64'
        shell: pwsh
        run: |
          $installer = Join-Path $PWD "MasterLens-${{ env.APP_VERSION }}-Windows-x64.exe"
          $process = Start-Process -FilePath $installer -ArgumentList "/S" -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "安装器退出码: $($process.ExitCode)" }

          $vst3 = Join-Path $env:CommonProgramFiles "VST3\MasterLens.vst3\Contents\x86_64-win\MasterLens.vst3"
          $standalone = Join-Path $env:ProgramFiles "MasterLens\MasterLens.exe"
          if (!(Test-Path $vst3)) { throw "VST3 不在 Common Files: $vst3" }
          if (!(Test-Path $standalone)) { throw "独立版不在 Program Files: $standalone" }

          $runtime = Join-Path $env:ProgramFiles "MasterLens\ffmpeg\ffmpeg.exe"
          $vstRuntime = Join-Path $env:CommonProgramFiles "VST3\MasterLens.vst3\Contents\Resources\ffmpeg\ffmpeg.exe"
          if (Test-Path $runtime) {
            & $runtime -hide_banner -version | Select-Object -First 1
            if (!(Test-Path $vstRuntime)) { throw "VST3 bundle is missing its FFmpeg runtime" }
            Write-Host "Bundled runtime verified: $runtime"
          } elseif ($env:ALLOW_MISSING_RUNTIME -ne "1") {
            throw "FFmpeg runtime missing after install"
          } else {
            Write-Host "::warning::Installed package has no bundled FFmpeg runtime (prerelease)."
          }
          Write-Host "Installed VST3: $vst3"
          Write-Host "Installed standalone: $standalone"

      - uses: actions/upload-artifact@v7
        with:
          name: MasterLens-Windows-${{ matrix.arch }}
          path: |
            MasterLens-${{ env.APP_VERSION }}-Windows-${{ matrix.arch }}.exe
            runtime-windows-${{ matrix.arch }}.json
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish verified installers
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [macos, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          pattern: MasterLens-*
          path: release
          merge-multiple: true
      - name: Verify assets and publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          test "$RELEASE_TAG" = "v${APP_VERSION}" || [[ "$RELEASE_TAG" == "v${APP_VERSION}-"* ]]
          cd release
          for asset in "MasterLens-${APP_VERSION}-macOS.dmg" "MasterLens-${APP_VERSION}-Windows-x64.exe" "MasterLens-${APP_VERSION}-Windows-ARM64.exe"; do
            test -s "$asset"
          done
          sha256sum *.dmg *.exe > SHA256SUMS.txt
          PRERELEASE=""
          case "$RELEASE_TAG" in
            *-*) PRERELEASE="--prerelease" ;;
          esac

          NOTES="../docs/release-${APP_VERSION}.md"
          test -f "$NOTES" || { echo "::error::missing release notes: $NOTES"; exit 1; }

          RUNTIME_MISSING=0
          shopt -s nullglob
          for report in runtime-*.json; do
            if grep -q '"present": *false' "$report"; then RUNTIME_MISSING=1; fi
          done
          shopt -u nullglob

          if [ "$RUNTIME_MISSING" = "1" ]; then
            case "$RELEASE_TAG" in
              *-*)
                cp "$NOTES" notes.md
                printf '\n\n> **Prerelease note:** this build was produced without a bundled FFmpeg runtime, so AAC/MP3 codec A/B needs a local ffmpeg or a build with the runtime. The runtime packaging and release gate are implemented; the binary is the only missing piece.\n' >> notes.md
                NOTES="notes.md"
                echo "::warning::Publishing prerelease without bundled FFmpeg runtime."
                ;;
              *)
                echo "::error::Stable release is missing the bundled FFmpeg runtime."
                exit 1
                ;;
            esac
          fi

          gh release create "$RELEASE_TAG" *.dmg *.exe SHA256SUMS.txt \
            --verify-tag --title "MasterLens ${APP_VERSION}" \
            $PRERELEASE \
            --notes-file "$NOTES"
